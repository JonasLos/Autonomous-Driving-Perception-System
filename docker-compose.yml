version: '3.3'

services:
  # Build-only service
  perception_image_builder:
    profiles: ["builder"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: parimiharsha/perception_image
    volumes:
      - /home/dev/Documents/Autonomous-Driving-Perception-System:/home/dev/Documents/Autonomous-Driving-Perception-System
    working_dir: /home/dev/Documents/Autonomous-Driving-Perception-System
    command: >
      bash -c "source ~/.bashrc &&
              source /opt/ros/jazzy/setup.bash &&
              colcon build --merge-install || true &&
              echo 'ROS2 workspace build (colcon) complete.'"

  yolo_node:
    image: parimiharsha/perception_image
    user: "1000:1000"
    network_mode: "host"
    ipc: "host"
    runtime: nvidia
    working_dir: /home/dev/Documents/Autonomous-Driving-Perception-System
    environment:
      - ROS_DOMAIN_ID=0
      - CONDA_ENVS_PATH=/opt/conda/envs
      - NVIDIA_VISIBLE_DEVICES=all 
    volumes:
      - /home/dev/Documents/Autonomous-Driving-Perception-System:/home/dev/Documents/Autonomous-Driving-Perception-System
      - /home/dev/anaconda3/envs:/opt/conda/envs
    command: >
      bash -c "source ~/.bashrc &&
               source /home/dev/miniconda/etc/profile.d/conda.sh &&
               source /opt/ros/jazzy/setup.bash &&
               export PYTHONPATH=/home/dev/Documents/Autonomous-Driving-Perception-System:$PYTHONPATH &&
               conda activate yolov9 &&
               source install/setup.bash &&
               ros2 launch yolov9_ros yolov9_ros.launch.py"

  sam_node:
    image: parimiharsha/perception_image
    user: "1000:1000"
    network_mode: "host"
    ipc: "host"
    runtime: nvidia
    working_dir: /home/dev/Documents/Autonomous-Driving-Perception-System
    environment:
      - ROS_DOMAIN_ID=0
      - CONDA_ENVS_PATH=/opt/conda/envs
      - NVIDIA_VISIBLE_DEVICES=all 
    volumes:
      - /home/dev/Documents/Autonomous-Driving-Perception-System:/home/dev/Documents/Autonomous-Driving-Perception-System
      - /home/dev/anaconda3/envs:/opt/conda/envs
    command: >
      bash -c "source ~/.bashrc &&
               source /home/dev/miniconda/etc/profile.d/conda.sh &&
               source /opt/ros/jazzy/setup.bash &&
               export PYTHONPATH=/home/dev/Documents/Autonomous-Driving-Perception-System:$PYTHONPATH &&
               conda activate sam2 &&
               source install/setup.bash &&
               ros2 launch sam2_ros sam2_ros.launch.py"

  clrernet_node:
    image: parimiharsha/perception_image
    user: "1000:1000"
    network_mode: "host"
    ipc: "host"
    runtime: nvidia
    working_dir: /home/dev/Documents/Autonomous-Driving-Perception-System
    environment:
      - ROS_DOMAIN_ID=0
      - CONDA_ENVS_PATH=/opt/conda/envs
      - NVIDIA_VISIBLE_DEVICES=all 
    volumes:
      - /home/dev/Documents/Autonomous-Driving-Perception-System:/home/dev/Documents/Autonomous-Driving-Perception-System
      - /home/dev/anaconda3/envs:/opt/conda/envs
    command: >
      bash -c "source ~/.bashrc &&
               source /home/dev/miniconda/etc/profile.d/conda.sh &&
               source /opt/ros/jazzy/setup.bash &&
               export PYTHONPATH=/home/dev/Documents/Autonomous-Driving-Perception-System:$PYTHONPATH &&
               export PYTHONPATH=/home/dev/Documents/Autonomous-Driving-Perception-System/src/clrernet_ros/src:/home/dev/Documents/Autonomous-Driving-Perception-System/src/clrernet_ros/src/clrernet:$PYTHONPATH &&
               conda activate clrernet &&
               source install/setup.bash &&
               ros2 launch clrernet_ros clrernet_ros.launch.py"


  transform_node:
    image: parimiharsha/perception_image
    user: "1000:1000"
    network_mode: "host"
    ipc: "host"
    runtime: nvidia
    working_dir: /home/dev/Documents/Autonomous-Driving-Perception-System
    environment:
      - ROS_DOMAIN_ID=0
      - CONDA_ENVS_PATH=/opt/conda/envs
      - NVIDIA_VISIBLE_DEVICES=all 
    volumes:
      - /home/dev/Documents/Autonomous-Driving-Perception-System:/home/dev/Documents/Autonomous-Driving-Perception-System
      - /home/dev/anaconda3/envs:/opt/conda/envs
    command: >
      bash -c "source ~/.bashrc &&
           source /home/dev/miniconda/etc/profile.d/conda.sh &&
           source /opt/ros/jazzy/setup.bash &&
           export PYTHONPATH=/home/dev/Documents/Autonomous-Driving-Perception-System:$PYTHONPATH &&
           conda activate yolov9 &&
           source install/setup.bash &&
           python src/transform.py"

  sphereformer_node:
    image: parimiharsha/perception_image
    user: "1000:1000"
    network_mode: "host"
    ipc: "host"
    runtime: nvidia
    working_dir: /home/dev/Documents/Autonomous-Driving-Perception-System
    environment:
      - ROS_MASTER_URI=http://localhost:11311
      - CONDA_ENVS_PATH=/opt/conda/envs
      - NVIDIA_VISIBLE_DEVICES=all 
    volumes:
      - /home/dev/Documents/Autonomous-Driving-Perception-System:/home/dev/Documents/Autonomous-Driving-Perception-System
      - /home/dev/anaconda3/envs:/opt/conda/envs
    command: >
      bash -c "source ~/.bashrc &&
              source /home/dev/miniconda/etc/profile.d/conda.sh &&
              source /opt/ros/jazzy/setup.bash &&
              source install/setup.bash &&
              conda activate sphereformer &&
              export PYTHONPATH=/home/dev/Documents/Autonomous-Driving-Perception-System:\$PYTHONPATH &&
              export LD_LIBRARY_PATH=\$\CONDA_PREFIX/lib:/usr/local/cuda/lib64:\$\LD_LIBRARY_PATH &&
              # export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/libpcl_filters.so.1.8:$LD_LIBRARY_PATH &&
              ros2 launch sphereformer_ros sphereformer_ros.launch.py"


#    export PYTHONPATH=/home/dev/Documents/Autonomous-Driving-Perception-System:\$PYTHONPATH &&
#  export PYTHONPATH=/home/dev/Documents/Autonomous-Driving-Perception-System/src/clrernet_ros/src/clrernet:$PYTHONPATH &&


  # controller_node service removed — it was ROS1/Python2 specific (AVA_Control)