# Shared by every runtime service so the ROS graph settings cannot drift apart, and so
# sim time is one switch rather than five.
#
# USE_SIM_TIME=true makes every node take its clock from /clock instead of the wall clock,
# which is what a replaying bag publishes with `ros2 bag play --clock`. It is what makes
# pausing and rate-scaling a bag behave: the watchdogs and the pairing deferral both read
# the node clock. Stamp-to-stamp pairing itself does not depend on it.
#
# NEVER set this on the vehicle. There is no /clock there, so every node's clock would sit
# frozen at 0: watchdogs never fire, deferrals never expire, TF lookups fail. Each node logs
# its use_sim_time at startup so a stray value in a local .env is visible in the first lines
# of `docker logs`. Default is false and .env is gitignored, so the safe value is the one you
# get by doing nothing.
x-common-env: &common-env
  ROS_DOMAIN_ID: "0"
  RMW_IMPLEMENTATION: "rmw_zenoh_cpp"
  USE_SIM_TIME: "${USE_SIM_TIME:-false}"
  # PyTorch sizes its CPU thread pool from the host core count, not the container's share, so
  # every one of these services was defaulting to 24 threads. Five of them on a 32-core box is
  # ~120 threads fighting over 32 cores: measured load average 47 with the GPU only 31% busy,
  # and the bag player -- which needs well under one core -- starved down to 6.3Hz on a 10Hz
  # topic. Capping the pools costs a little single-node latency and buys back the scheduler.
  OMP_NUM_THREADS: "${OMP_NUM_THREADS:-4}"
  MKL_NUM_THREADS: "${MKL_NUM_THREADS:-4}"

services:
  cuda_base_builder:
    profiles: ["builder"]
    build:
      context: .
      dockerfile: docker/Dockerfile.cuda-base
    image: perception-cuda-base:latest
    container_name: perception_cuda_base_builder
    command: ["/bin/bash"]
    restart: "no"

  base_builder:
    profiles: ["builder"]
    build:
      context: .
      dockerfile: docker/Dockerfile.base
    image: perception-base:latest
    container_name: perception_base_builder
    working_dir: /workspace/Autonomous-Driving-Perception-System
    command: ["/bin/bash"]
    restart: "no"

  sphereformer_node:
    profiles: ["runtime"]
    build:
      context: .
      dockerfile: docker/Dockerfile.sphereformer
    image: perception-sphereformer:latest
    container_name: perception_sphereformer_node
    network_mode: "host"
    ipc: "host"
    working_dir: /workspace/Autonomous-Driving-Perception-System
    # Map form, not the list form this service used to use: YAML merge keys only work on
    # mappings, and every service needs to pick up x-common-env.
    environment:
      <<: *common-env
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "all"
    volumes:
      # The 371MB checkpoint is excluded from the build context by .dockerignore:22, so it is
      # never in the image and the node dies with FileNotFoundError on startup. setup.py
      # already installs it to share/ -- but only `if os.path.isfile(...)`, so its absence is
      # silent at build time and only shows up at runtime.
      #
      # Mounting it into the *source* tree rather than the install tree is deliberate: the
      # container runs `colcon build` at startup, so setup.py picks the file up and copies it
      # to share/sphereformer_ros/SphereFormer/ exactly as it would on a normal build. Mounting
      # into the install tree instead would put a read-only file where colcon wants to write.
      #
      # Set SPHEREFORMER_CHECKPOINT to keep the weights outside the repo entirely.
      - ${SPHEREFORMER_CHECKPOINT:-./src/sphereformer_ros/src/SphereFormer/model_semantic_kitti.pth}:/workspace/Autonomous-Driving-Perception-System/src/sphereformer_ros/src/SphereFormer/model_semantic_kitti.pth:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - bash
      - -lc
      - |
        set -e
        source /opt/ros/jazzy/setup.bash
        source /opt/venv/bin/activate
        export RMW_IMPLEMENTATION=rmw_zenoh_cpp
        export PYTHONPATH=/opt/venv/lib/python3.12/site-packages:$PYTHONPATH
        colcon --log-base /tmp/sphereformer-log build --packages-select perception_common sphereformer_ros --build-base /tmp/sphereformer-build --install-base /tmp/sphereformer-install
        source /tmp/sphereformer-install/setup.bash
        export PYTHONPATH=/tmp/sphereformer-install/sphereformer_ros/lib/python3.12/site-packages:/tmp/sphereformer-install/perception_common/lib/python3.12/site-packages:/opt/venv/lib/python3.12/site-packages:$PYTHONPATH
        python3 /tmp/sphereformer-install/sphereformer_ros/lib/python3.12/site-packages/sphereformer_ros.py --ros-args -p input_topic:=/lidar_tc/velodyne_points -p use_sim_time:=$${USE_SIM_TIME}
    restart: "no"

  # yolo_node:
  #   profiles: ["runtime"]
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.yolo
  #   image: perception-yolo:latest
