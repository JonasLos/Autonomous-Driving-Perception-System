services:
  base_builder:
    profiles: ["builder"]
    build:
      context: .
      dockerfile: docker/Dockerfile.base
    image: perception-base:latest
    container_name: perception_base_builder
    working_dir: /workspace/Autonomous-Driving-Perception-System
    command: ["/bin/bash"]
    restart: "no"

  # yolo_node:
  #   profiles: ["runtime"]
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.yolo
  #   image: perception-yolo:latest
  #   container_name: perception_yolo_node
  #   network_mode: "host"
  #   ipc: "host"
  #   working_dir: /workspace/Autonomous-Driving-Perception-System
  #   environment:
  #     ROS_DOMAIN_ID: "0"
  #     YOLO_CONFIG_DIR: "/tmp/Ultralytics"
  #     NVIDIA_VISIBLE_DEVICES: "all"        # ← 新增：让容器看到所有 GPU
  #     NVIDIA_DRIVER_CAPABILITIES: "all"    # ← 新增：开放全部驱动能力
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all                   # 或写 count: 1 只用一张
  #             capabilities: [gpu]
  #   restart: "no"

  yolo_node:
    profiles: ["runtime"]
    build:
      context: .
      dockerfile: docker/Dockerfile.yolo
    image: perception-yolo:latest
    container_name: perception_yolo_node
    network_mode: "host"
    ipc: "host"
    working_dir: /workspace/Autonomous-Driving-Perception-System
    
    # entrypoint: ["/bin/bash", "-c", "tail -f /dev/null"]
    tty: true
    stdin_open: true
    # ---------------------------------------------

    environment:
      ROS_DOMAIN_ID: "0"
      YOLO_CONFIG_DIR: "/tmp/Ultralytics"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "all"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: "no"
    
  sam3_ros:
    build:
      context: .
      dockerfile: docker/Dockerfile.sam
    image: test-sam3:latest
    container_name: test_sam3_container
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    shm_size: "8gb"
    working_dir: /root/ws
    environment:
      ROS_DOMAIN_ID: "0"
      RMW_IMPLEMENTATION: "rmw_zenoh_cpp"
      PYTHONUNBUFFERED: "1"
      HF_TOKEN: "${HF_TOKEN:-}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4
    volumes:
      - .:/root/ws
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      # - ./send_test_image.py:/root/ws/send_test_image.py:ro
      # - ./test.png:/root/ws/test.png:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      bash -lc "
      source /opt/ros/humble/setup.bash &&
      cd /root/ws/src/SAM3_ROS_NODE &&
      uv sync --python 3.10 &&
      export PYTHONPATH=/root/ws/src/SAM3_ROS_NODE/.venv/lib/python3.10/site-packages:$PYTHONPATH &&
      cd /root/ws &&
      colcon build --symlink-install --packages-select sam3_ros &&
      source /root/ws/install/setup.bash &&
      ros2 run sam3_ros segmentation_node
      "

