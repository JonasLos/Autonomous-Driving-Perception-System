  clrernet_node:
    profiles: ["runtime"]
    build:
      context: .
      dockerfile: docker/Dockerfile.clrernet
    image: perception-clrernet:latest
    container_name: perception_clrernet_node
    network_mode: "host"
    ipc: "host"
    shm_size: "8gb"
    working_dir: /workspace/Autonomous-Driving-Perception-System
    stdin_open: true
    tty: true
    environment:
      <<: *common-env
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "all"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: "no"

  yolo_node:
    profiles: ["runtime"]
    build:
      context: .
      dockerfile: docker/Dockerfile.yolo
    image: perception-yolo:latest
    container_name: perception_yolo_node
    network_mode: "host"
    ipc: "host"
    working_dir: /workspace/Autonomous-Driving-Perception-System
    tty: true
    stdin_open: true
    volumes:
      - .:/workspace/Autonomous-Driving-Perception-System
    environment:
      <<: *common-env
      YOLO_MODEL_PATH: "/workspace/Autonomous-Driving-Perception-System/src/Custom_YOLO_ROS/yolov9_custom_model_with_signs_and_cones.pt"
      YOLO_USE_FUSION: "True"
      YOLO_CONFIG_DIR: "/tmp/Ultralytics"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "all"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - bash
      - -c
      - |
        unset AMENT_PREFIX_PATH CMAKE_PREFIX_PATH COLCON_PREFIX_PATH PYTHONPATH
        source /opt/ros/jazzy/setup.bash
        cd /workspace/Autonomous-Driving-Perception-System
        colcon build --merge-install \
          --packages-select perception_common yolo_msgs yolo_ros yolo_bringup \
          --build-base /tmp/yolo_ws_build \
          --install-base /tmp/yolo_ws_install
        source /tmp/yolo_ws_install/setup.bash
        export PATH=/opt/yolo_venv/bin:$PATH
        export PYTHONPATH=/opt/yolo_venv/lib/python3.12/site-packages:/tmp/yolo_ws_install/lib/python3.12/site-packages:/opt/ros/jazzy/lib/python3.12/site-packages
        export PYTHONNOUSERSITE=1
        python3 -c "import importlib.metadata as m, os, sys; print('YOLO python=', sys.executable); print('YOLO PYTHONPATH=', os.environ.get('PYTHONPATH')); m.distribution('yolo-ros'); print('yolo-ros metadata: OK')"
        ros2 launch yolo_bringup yolov9.launch.py model:=$${YOLO_MODEL_PATH} use_fusion:=$${YOLO_USE_FUSION} use_sim_time:=$${USE_SIM_TIME}
    restart: "no"

  transform_node:
    profiles: ["runtime"]
    build:
      context: .
      dockerfile: docker/Dockerfile.transform
    image: perception-transform:latest
    container_name: perception_transform_node
    network_mode: "host"
    ipc: "host"
    working_dir: /workspace/Autonomous-Driving-Perception-System
    environment:
      <<: *common-env
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "all"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: "no"
    
  sam3_ros:
    build:
      context: .
      dockerfile: docker/Dockerfile.sam
    image: test-sam3:latest
    container_name: test_sam3_container
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    shm_size: "8gb"
    working_dir: /root/ws
    environment:
      <<: *common-env
      PYTHONUNBUFFERED: "1"
      HF_TOKEN: "${HF_TOKEN:-}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4
    volumes:
      - .:/root/ws
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      # - ./send_test_image.py:/root/ws/send_test_image.py:ro
      # - ./test.png:/root/ws/test.png:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - bash
      - -lc
      - |
        source /opt/ros/jazzy/setup.bash
        cd /root/ws/src/SAM3_ROS_NODE
        python3 - <<'PY'
        from pathlib import Path

        path = Path("scripts/segmentation_node")
        path.parent.mkdir(parents=True, exist_ok=True)
        if not path.exists():
          path.write_text(
            "#!/usr/bin/env python3\n"
            "from sam3_ros.segmentation import main\n\n"
            "if __name__ == \"__main__\":\n"
            "    main()\n"
          )
        PY
        chmod +x scripts/segmentation_node
        sed -i '\#src/sam3_ros/pub_test_image.py#d' CMakeLists.txt
        uv sync --python 3.12
        # ros2_numpy used to be cloned from GitHub here, because sam3_mask_transform parsed
        # clouds with it and it is not on PyPI. That node now uses perception_common's shared
        # ProjectedCloud, which parses with sensor_msgs_py -- shipped with Jazzy. Nothing in
        # this container imports ros2_numpy any more, so the clone is gone: one less network
        # dependency at container start, which matters when replaying bags offline.
        python3 -c "import sensor_msgs_py.point_cloud2" 2>/dev/null || (
          apt-get update && apt-get install -y ros-jazzy-sensor-msgs-py && rm -rf /var/lib/apt/lists/*
        )
        export PYTHONPATH=/root/ws/src/SAM3_ROS_NODE/.venv/lib/python3.12/site-packages:$PYTHONPATH
        cd /root/ws
        colcon build --merge-install \
          --packages-select perception_common sam2_msgs sam3_ros \
          --build-base /tmp/sam3_ws_build \
          --install-base /tmp/sam3_ws_install
        source /tmp/sam3_ws_install/setup.bash
        ros2 run sam3_ros segmentation_node --ros-args -p use_sim_time:=$${USE_SIM_TIME} &
        seg_pid=$$!
        # The transform node pairs each contour with the buffered LiDAR projection
        # captured nearest to it, so pipeline latency no longer needs to be absorbed
        # by a freshness bound — max_pairing_skew only has to cover LiDAR period and
        # jitter. Raise projection_buffer_duration instead if contour latency ever
        # exceeds it (the node logs which case it hit). Tune live with:
        #   ros2 param set /sam3_mask_transform max_pairing_skew <seconds>
        #   ros2 param set /sam3_mask_transform projection_buffer_duration <seconds>
        ros2 run sam3_ros sam3_mask_transform_node --ros-args -p use_sim_time:=$${USE_SIM_TIME} &
        mask_pid=$$!
        trap 'kill $$seg_pid $$mask_pid' SIGINT SIGTERM
        wait -n $$seg_pid $$mask_pid

