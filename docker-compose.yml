  #     NVIDIA_VISIBLE_DEVICES: "all"        # ← 新增：让容器看到所有 GPU
  #     NVIDIA_DRIVER_CAPABILITIES: "all"    # ← 新增：开放全部驱动能力
  #   deploy:
