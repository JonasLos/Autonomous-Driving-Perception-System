# Overlay, composed alongside the base file -- which is NOT edited:
#
#   docker compose -f docker-compose.yml -f docker-compose.fusion.yml \
#       --profile fusion up -d object_fusion_node
#
# `docker compose --profile runtime up` stays exactly what it is today, with or without this
# file present.
services:
  object_fusion_node:
    profiles: ["fusion"]
    build:
      context: .
      dockerfile: docker/Dockerfile.object_fusion
    image: perception-object-fusion:${OBJECT_FUSION_IMAGE_TAG:-latest}
    container_name: perception_object_fusion_node
    network_mode: host
    ipc: host
    restart: "no"
    environment:
      ROS_DOMAIN_ID: "0"
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      USE_SIM_TIME: "${USE_SIM_TIME:-false}"
      PUBLISH_MODE: "${PUBLISH_MODE:-filtered}"
      ENABLE_RADAR_ONLY_BIRTH: "${ENABLE_RADAR_ONLY_BIRTH:-false}"
      ENABLE_EXTENT_ESTIMATION: "${ENABLE_EXTENT_ESTIMATION:-false}"
      EGO_YAW_CORRECTION_DEG: "${EGO_YAW_CORRECTION_DEG:--5.35}"
      # Ground-flagged projection (Patchwork++); /lidar_2d_projection is the rollback.
      PROJECTION_TOPIC: "${PROJECTION_TOPIC:-/perception/lidar_2d_projection_ground}"
      ODOM_TOPIC: "${ODOM_TOPIC:-/novatel/oem7/odom}"
      PUBLISH_DEBUG_CLOUDS: "${PUBLISH_DEBUG_CLOUDS:-false}"
      # Rollbacks for what is live by default, so each can be A/B'd without a rebuild.
      GROUND_LEVELLING: "${GROUND_LEVELLING:-true}"
      ENABLE_DEPTH_GATE: "${ENABLE_DEPTH_GATE:-true}"
      ENABLE_CLASS_VOTE: "${ENABLE_CLASS_VOTE:-true}"
      SEGMENTATION_EMPTY_FALLBACK: "${SEGMENTATION_EMPTY_FALLBACK:-false}"
      ENABLE_CAMERA_ONLY_FALLBACK: "${ENABLE_CAMERA_ONLY_FALLBACK:-false}"
      # The aggregator's two association widths. ASSOC_MAX_DIST=6.0 MERGE_MAX_DIST=inf is the
      # behaviour as first shipped, kept reachable for A/B.
      ASSOC_MAX_DIST: "${ASSOC_MAX_DIST:-6.0}"
      MERGE_MAX_DIST: "${MERGE_MAX_DIST:-2.5}"
      # Radar range gate against the track's own camera range; false restores the old behaviour.
      RADAR_CAMERA_GATE: "${RADAR_CAMERA_GATE:-true}"
      # 360-degree LiDAR clusters sustaining tracks the camera has passed.
      ENABLE_LIDAR_CLUSTERS: "${ENABLE_LIDAR_CLUSTERS:-true}"
      CLUSTER_MAX_LATERAL: "${CLUSTER_MAX_LATERAL:-0.0}"
      CLUSTER_METHOD: "${CLUSTER_METHOD:-grid}"
      CAMERA_MISS_IN_IMAGE_ONLY: "${CAMERA_MISS_IN_IMAGE_ONLY:-true}"
      TURN_VELOCITY_K: "${TURN_VELOCITY_K:-1.0}"
      # Obstacle-robust road boundaries (own topics only); off until measured.
      ENABLE_ROAD_BOUNDARY: "${ENABLE_ROAD_BOUNDARY:-false}"
      ROAD_BOUNDARY_OCCLUSION: "${ROAD_BOUNDARY_OCCLUSION:-true}"
      ROAD_BOUNDARY_EXTRACTION: "${ROAD_BOUNDARY_EXTRACTION:-false}"
      ROAD_BOUNDARY_FIT: "${ROAD_BOUNDARY_FIT:-true}"
      ROAD_BOUNDARY_TRACKING: "${ROAD_BOUNDARY_TRACKING:-true}"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-4}"
