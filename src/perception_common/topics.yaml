topics:
  raw:
    # The AVT front cameras publish "~/image" with node name camera_fl / camera_fr and
    # no namespace, so the topic is /camera_<x>/image -- /camera_<x>/image_raw does not
    # exist. image_proc's debayer_node derives /camera_<x>/image_color from it, but that
    # node runs a standing ~0.5s backlog, so subscribe to the raw topic and let
    # cv_bridge debayer bayer_rggb8 -> bgr8 in-process instead.
    # Rear cameras are /camera_rear_1..3/; the rc/tl/tr names survive only as TF frames
    # and calibration filenames, and nothing maps them onto the three namespaces.
    camera: "/camera_fl/image"
    radar: "/delphi_esr_interface/radar/tracks"
    camera_fl: "/camera_fl/image"
    camera_fr: "/camera_fr/image"
    camera_rear_1: "/camera_rear_1/image"
    camera_rear_2: "/camera_rear_2/image"
    camera_rear_3: "/camera_rear_3/image"
    imu: "/imu/data_raw"
    gps_imu: "/gps/imu"
    lidar_tc_packets: "/lidar_tc/velodyne_packets"
    lidar_tc: "/lidar_tc/velodyne_points"
    lidar_tl_packets: "/lidar_tl/velodyne_packets"
    lidar_tl: "/lidar_tl/velodyne_points"
    lidar_tr_packets: "/lidar_tr/velodyne_packets"
    lidar_tr: "/lidar_tr/velodyne_points"
    # Delphi ESR 2.5 on the front bumper, driven over Kvaser CAN by
    # ~/ros_drivers/src/delphi_esr_driver. The old /radar_fc/as_tx/* names here were
    # AutonomouStuff conventions for a radar this vehicle does not have -- nothing ever
    # published them. The driver emits delphi_esr_driver/msg/EsrTrackArray (polar:
    # range, angle, range_rate; no elevation) and leaves header.frame_id EMPTY; the
    # frame is delphi_esr_radar, which /tf_static does carry relative to lidar_tc.
    radar_tracks: "/delphi_esr_interface/radar/tracks"
    radar_status: "/delphi_esr_interface/radar/status"
    radar_markers: "/delphi_esr_interface/radar/markers"
    ins: "/novatel/oem7/odom"
    tf_static: "/tf_static"
    camera_info: "/camera_fl/camera_info"

  yolo:
    image: "/yolov9/published_image"
    bbox: "/yolov9/bboxInfo"
    fused_bbox: "/fused_bbox"

  sam:
    segmentation_mask: "/sam_road_segmentation"
    left_contour: "/sam_left_contour"
    right_contour: "/sam_right_contour"
    left_boundary: "/sam_left_boundary"
    right_boundary: "/sam_right_boundary"

  sam3:
    left_contour: "/sam3_left_contour"
    right_contour: "/sam3_right_contour"
    left_boundary: "/sam3_left_boundary"
    right_boundary: "/sam3_right_boundary"
    # Per-pixel road mask ids (PNG) and the obstacle mask from the same image encoding.
    mask_image: "/segmentation/mask_image/compressed"
    obstacle_mask: "/segmentation/obstacle_mask/compressed"

  sphereformer:
    segmentation_mask: "/sphereformer_road_segmentation"
    left_boundary: "/sphereformer_left_boundary"
    right_boundary: "/sphereformer_right_boundary"
    legend: "/sphereformer_legend"
    ring_filtered: "/filtered_points"

  clrernet:
    lane_mask: "/clrernet/lane_mask"
    all_lanes: "/clrernet/all_lanes"
    left_lane: "/clrernet/left_lane"
    right_lane: "/clrernet/right_lane"
    centerline: "/clrernet/current_centerline"

  transform:
    lidar_2d_projection: "/lidar_2d_projection"

  # Produced by src/object_fusion (its own config/topics.yaml owns these names). Listed here
  # only so recording categories can reference them and play_rosbag.sh knows they are
  # produced inside the stack.
  object_fusion:
    objects: "/perception/objects"
    projection_ground_flagged: "/perception/lidar_2d_projection_ground"
    road_boundary_sphereformer_left: "/road_boundary/sphereformer/left"
    road_boundary_sphereformer_right: "/road_boundary/sphereformer/right"
    road_boundary_sam3_left: "/road_boundary/sam3/left"
    road_boundary_sam3_right: "/road_boundary/sam3/right"

  radar:
    tracked_objects: "/tracked_objects"
    track_markers: "/radar_tracks_markers"

  planning:
    local_path: "/local_path"
    global_trajectory: "/corrected_g_traj"
    fsm_state: "/current_fsm_state"
    gps_segment: "/gps_traj_segment"
    obstacle_prediction: "/obstacle_traj_prediction"
    target_trajectory: "/target_traj"

  controls:
    ctrl_ref: "/ctrl_ref.*"
    vehicle: "/vehicle.*"
    lat_perf: "/lat_ctrl_perf"
    fsm_status: "/current_fsm_status"

categories:
  perception_input:
    - topics.raw.camera
    - topics.raw.lidar_tc
    - topics.raw.radar_tracks
    - topics.raw.radar_markers
    - topics.raw.imu
    - topics.raw.gps_imu
    - topics.raw.ins
    - topics.raw.camera_info
    - topics.raw.tf_static

  perception_output:
    - topics.yolo.image
    - topics.yolo.bbox
    - topics.yolo.fused_bbox
    - topics.sam.segmentation_mask
    - topics.sam.left_contour
    - topics.sam.right_contour
    - topics.sam.left_boundary
    - topics.sam.right_boundary
    # SAM3 replaced SAM2 on the vehicle; the topics.sam.* entries above are SAM2's and record
    # nothing when only SAM3 runs.
    - topics.sam3.left_contour
    - topics.sam3.right_contour
    - topics.sam3.left_boundary
    - topics.sam3.right_boundary
    - topics.sphereformer.segmentation_mask
    - topics.sphereformer.left_boundary
    - topics.sphereformer.right_boundary
    - topics.raw.ins
    - topics.raw.tf_static
    - topics.clrernet.lane_mask
    - topics.clrernet.all_lanes
    - topics.clrernet.left_lane
    - topics.clrernet.right_lane
    - topics.clrernet.centerline
    - topics.radar.tracked_objects

  # The minimum set a bag needs to drive the whole perception stack offline. Everything
  # downstream of these is produced by the containers themselves, so replaying any of it
  # would double-publish. scripts/play_rosbag.sh defaults to this category.
  replay_input:
    - topics.raw.camera
    - topics.raw.camera_info
    - topics.raw.lidar_tc
    - topics.raw.tf_static
    # Radar is an input, not a container output, so it belongs here. Bags recorded
    # before 2026-09-09 that predate radar simply have no messages on this topic and
    # play_rosbag.sh skips it; there is no downside to listing it.
    - topics.raw.radar_tracks
    # The radar range-rate validation compares against ego velocity, so odom has to be
    # replayed alongside it.
    - topics.raw.ins

  # Everything needed to re-evaluate the road boundaries offline (scripts/road_boundary_ab.py,
  # scripts/road_boundary_planner_ab.py): the replay inputs plus each stage's output, so a
  # drive can be replayed through new boundary rules without re-running the GPU models.
  boundary_eval:
    - topics.raw.camera
    - topics.raw.camera_info
    - topics.raw.lidar_tc
    - topics.raw.tf_static
    - topics.raw.radar_tracks
    - topics.raw.ins
    - topics.sphereformer.segmentation_mask
    - topics.sphereformer.left_boundary
    - topics.sphereformer.right_boundary
    - topics.sam3.mask_image
    - topics.sam3.obstacle_mask
    - topics.sam3.left_contour
    - topics.sam3.right_contour
    - topics.sam3.left_boundary
    - topics.sam3.right_boundary
    - topics.transform.lidar_2d_projection
    - topics.object_fusion.objects
    - topics.object_fusion.projection_ground_flagged
    - topics.object_fusion.road_boundary_sphereformer_left
    - topics.object_fusion.road_boundary_sphereformer_right
    - topics.object_fusion.road_boundary_sam3_left
    - topics.object_fusion.road_boundary_sam3_right

  raw:
    - topics.raw.camera
    - topics.raw.radar
    - topics.raw.ins
    - topics.raw.camera_fl
    - topics.raw.camera_fr
    - topics.raw.camera_rear_1
    - topics.raw.camera_rear_2
    - topics.raw.camera_rear_3
    - topics.raw.lidar_tc
    - topics.raw.lidar_tl
    - topics.raw.lidar_tr
    - topics.raw.radar_tracks
    - topics.raw.imu
    - topics.raw.gps_imu
    - topics.raw.ins

  planning:
    - topics.planning.local_path
    - topics.planning.global_trajectory
    - topics.planning.fsm_state
    - topics.planning.gps_segment
    - topics.planning.obstacle_prediction
    - topics.planning.target_trajectory

  controls:
    - topics.controls.ctrl_ref
    - topics.controls.vehicle
    - topics.controls.lat_perf
    - topics.controls.fsm_status

  # Narrow "just the YOLO result and the projection" set. Every entry here used to point at
  # a topics.outputs.* block that does not exist, so the whole category resolved to four
  # literal "null" topic names.
  outputs:
    - topics.yolo.bbox
    - topics.yolo.image
    - topics.raw.tf_static
    - topics.transform.lidar_2d_projection
