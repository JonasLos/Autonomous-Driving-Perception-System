    - topics.controls.vehicle
    - topics.controls.lat_perf
    - topics.controls.fsm_status

  outputs:
    - topics.outputs.yolov9_bbox
    - topics.outputs.yolov9_image
    - topics.outputs.tf_static
    - topics.outputs.lidar_2d_projection
