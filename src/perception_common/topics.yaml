    - topics.raw.camera_info
    - topics.raw.tf_static

  perception_output:
    - topics.yolo.image
    - topics.yolo.bbox
    - topics.yolo.fused_bbox
    - topics.sam.segmentation_mask
    - topics.sam.left_contour
    - topics.sam.right_contour
    - topics.sam.left_boundary
    - topics.sam.right_boundary
    - topics.sphereformer.segmentation_mask
    - topics.sphereformer.left_boundary
    - topics.sphereformer.right_boundary
    - topics.raw.ins
    - topics.raw.tf_static
    - topics.clrernet.lane_mask
    - topics.clrernet.all_lanes
    - topics.clrernet.left_lane
    - topics.clrernet.right_lane
    - topics.clrernet.centerline

  raw:
    - topics.raw.camera
    - topics.raw.lidar
    - topics.raw.radar
    - topics.raw.ins
    - topics.raw.camera_fl
    - topics.raw.camera_fr
    - topics.raw.camera_rear_1
    - topics.raw.camera_rear_2
    - topics.raw.camera_rear_3
    - topics.raw.lidar_tc
    - topics.raw.lidar_tl
    - topics.raw.lidar_tr
    - topics.raw.radar_tracks
    - topics.raw.radar_objects
    - topics.raw.imu
