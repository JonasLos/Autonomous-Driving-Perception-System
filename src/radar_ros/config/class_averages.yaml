# Average physical extents per class, salvaged from src/yolov9_ros/src/class_averages.yaml
# when the legacy objects_transform node was retired.
#
# The camera+LiDAR fusion publishes every object as a 1.5 x 1.5 x 1.5 m cube regardless of
# class -- a pedestrian, a traffic cone and a semi all get the same box. These give
# /tracked_objects a plausible extent instead. They are class AVERAGES, not measured
# per-object dimensions: LiDAR returns inside a 2D box give a position, not an extent, and
# nothing in the current pipeline estimates a real size or orientation.
#
# Matched by class NAME, not by class_id. The deployed detector is a custom YOLOv9 with
# added sign and cone classes -- note the "Speed limit: NN" entries below, which are not in
# COCO at all -- so its indices are not COCO's, and indexing this table by id would
# confidently assign the wrong dimensions.
#
# dimensions are [y, z, x] = [width, height, length] in metres, as in the original file.
